# Package EchoFlowSiHub Desktop for Windows (and macOS once a runner exists).
#
# Adapted from upstream's `windows-package.yml`. Upstream builds on a
# self-hosted runner holding an EV signing token (`runs-on:
# dsh-win-package-trial`) with a machine-local packaging preset; neither
# exists here, so this runs on GitHub-hosted runners and takes the unsigned
# path upstream documents for builds without signing credentials.
#
# A Windows installer must be built on Windows - upstream checks and refuses
# otherwise - which is what `windows-latest` provides.
#
# Artifacts are attached to the workflow run; publishing them to a download
# site and wiring the update feed is a separate step (see desktop/README.md).

name: Package Desktop

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: '上游 tag（改动后需重新验证构建）'
        type: string
        default: dsh-v0.2.1-rc.2
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  package:
    name: win-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The plugin tarball is the overlay's input, so the workspace's own
      # dependencies come first.
      - name: Install workspace dependencies
        run: pnpm install

      - name: Build the installer
        env:
          DSH_UPSTREAM_TAG: ${{ inputs.upstream_tag || 'dsh-v0.2.1-rc.2' }}
          DSH_UNSIGNED: '1'
        run: bash desktop/scripts/build-desktop.sh win:x64

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp -v .desktop-build/artifacts/win-x64/* dist/ 2>/dev/null || true
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: EchoFlowSiHub-win-x64
          path: dist/*
          if-no-files-found: error

      # A tag build also attaches to the release, so the download page and the
      # update feed can point at one place.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
